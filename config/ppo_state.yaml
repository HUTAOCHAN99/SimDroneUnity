# ppo_state.yaml -- nilai awal; tuning lewat uji awal
# Jalankan (contoh):
#   mlagents-learn config/ppo_state.yaml --run-id=track1_seed1 --seed=1 --time-scale=20
# lalu tekan Play di Unity Editor (atau pakai --env=build.exe --no-graphics untuk agen state-based).
# Behavior Name di Behavior Parameters HARUS sama dengan kunci di bawah ("DroneState").

behaviors:
  DroneState:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2            # clipping PPO (nilai awal sesuai Schulman et al., 2017)
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3.0e6
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 200000
    keep_checkpoints: 5

torch_settings:
  device: cpu                 # MX350 (2 GB) tidak membantu untuk MLP kecil; CPU cukup
