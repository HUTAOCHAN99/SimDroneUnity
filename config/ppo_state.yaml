# ppo_state.yaml -- v6 (setelah diag15)
# diag16: mlagents-learn config\ppo_state.yaml --run-id=diag16 --seed=1 --initialize-from=diag13 --env-args -track 1
# (hapus --env-args bila training di Editor). Pindahkan episode_metrics.csv lama dulu.
# Behavior Name di Behavior Parameters HARUS "DroneState".
# Ganti nama episode_metrics.csv lama sebelum run (kolom CSV bertambah).

behaviors:
  DroneState:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: constant   # DIUBAH dari linear: LR yang meluruh ke 0 mematikan belajar tepat setelah puncak (~150k)
      beta: 3.0e-3                       # DIUBAH dari 1e-3 (diag14): entropy diag13 sudah 0,36 dan terus turun, sementara gerbang 3+ belum pernah dikuasai
      beta_schedule: constant            # DIUBAH: beta tidak meluruh ke 0
      epsilon: 0.2
      epsilon_schedule: constant         # DIUBAH dari linear
      lambd: 0.95
      num_epoch: 5                       # DIUBAH dari 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995                     # DIUBAH dari 0.99: gerbang 0 sekitar 4-5 detik (100+ keputusan) di depan
        strength: 1.0
    max_steps: 2000000                   # diag15; perpanjang bila GatesPassed masih naik
    time_horizon: 256                    # DIUBAH dari 128
    summary_freq: 20000
    checkpoint_interval: 100000
    keep_checkpoints: 5

torch_settings:
  device: cpu

# Parameter lingkungan (dibaca DroneAgent v12 tiap episode; menimpa Inspector).
# KURIKULUM TERBALIK: spawn dekat gerbang 2..4 dulu (lolos hampir pasti -> PPO melihat reward 'lolos'), lalu menjauh sesuai progress training.
environment_parameters:
  stall_penalty: 4.0
  dwell_coef: 0.004
  dwell_grace: 1.0
  random_start_prob: 0.5
  random_start_min_gate: 2     # fokus gerbang yang macet (gerbang 1 sudah bisa dari start normal)
  random_start_max_gate: 4
  random_start_min_speed: 1.5  # m/s menuju gerbang: tidak diam saat spawn
  random_start_max_speed: 3.0
  random_start_dist:           # jarak maks di depan gerbang saat spawn (m); dinaikkan berdasar progress max_steps
    curriculum:
      - name: Dekat
        completion_criteria: {measure: progress, behavior: DroneState, signal_smoothing: false, min_lesson_length: 1, threshold: 0.15}
        value: 1.5
      - name: Sedang
        completion_criteria: {measure: progress, behavior: DroneState, signal_smoothing: false, min_lesson_length: 1, threshold: 0.30}
        value: 2.5
      - name: Jauh
        completion_criteria: {measure: progress, behavior: DroneState, signal_smoothing: false, min_lesson_length: 1, threshold: 0.45}
        value: 4.0
      - name: SangatJauh
        completion_criteria: {measure: progress, behavior: DroneState, signal_smoothing: false, min_lesson_length: 1, threshold: 0.60}
        value: 6.0
      - name: Penuh
        value: 9.0